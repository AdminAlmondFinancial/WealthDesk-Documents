trigger:
  branches:
    include: [main, master]
  paths:
    include: [AI.Client.API/*]

pool:
  vmImage: ubuntu-latest

variables:
  - group: ai-client-api   # holds ConnectionStrings__Default (secret) for the target database

stages:
  - stage: Build
    jobs:
      - job: BuildAndTest
        variables:
          ConnectionStrings__Default: Host=localhost;Username=postgres;Password=ci-only-password;Database=postgres
        steps:
          - task: UseDotNet@2
            inputs:
              version: 9.0.x
          - script: |
              docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=ci-only-password postgres:16
              until docker exec pg pg_isready -U postgres; do sleep 1; done
            displayName: Start Postgres
          - script: dotnet build AI.Client.API/AI.Client.slnx -c Release
            displayName: Build
          - script: dotnet run --project AI.Client.API/AI.Client.DataMigration -c Release --no-build
            displayName: Run migrations (test database)
          - script: dotnet test AI.Client.API/AI.Client.slnx -c Release --no-build
            displayName: Test
          - script: docker build -f AI.Client.API/AI.Client.API/Dockerfile -t ai-client-api:$(Build.BuildId) AI.Client.API
            displayName: Build image

  - stage: Deploy
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Deploy
        steps:
          - task: UseDotNet@2
            inputs:
              version: 9.0.x
          - checkout: self
          - template: deploy-steps.yml
            parameters:
              connectionString: $(ConnectionStrings__Default)
